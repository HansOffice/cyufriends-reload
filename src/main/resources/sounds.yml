# 音效配置
# 修改后可执行 /friend reload 实时热重载，音效名兼容原版 Sound 枚举

# 界面普通按键点击
gui-click:
  # 音效名称，支持原版 Sound 枚举名
  sound: UI_BUTTON_CLICK
  # 音量大小，标准大小为 1.0
  volume: 0.45
  # 音调高低，标准音调为 1.0
  pitch: 1.15

# 次级操作点击（右键或 Shift 右键）
gui-secondary-click:
  sound: UI_BUTTON_CLICK
  volume: 0.42
  pitch: 0.95

# 中键点击
gui-middle-click:
  sound: UI_BUTTON_CLICK
  volume: 0.42
  pitch: 1.35

# 列表翻页
gui-page:
  sound: BLOCK_NOTE_BLOCK_HAT
  volume: 0.38
  pitch: 1.25

# 界面关闭或返回
gui-close:
  sound: UI_BUTTON_CLICK
  volume: 0.42
  pitch: 0.8

# 确认、通过或应用设置
gui-confirm:
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.55
  pitch: 1.35

# 取消、拒绝或返回上一级
gui-cancel:
  sound: BLOCK_NOTE_BLOCK_BASS
  volume: 0.45
  pitch: 0.8

# 发出好友申请
request-sent:
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 0.8
  pitch: 1.2

# 收到好友申请
request-received:
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.8
  pitch: 1.0

# 建立好友关系
friend-added:
  sound: ENTITY_PLAYER_LEVELUP
  volume: 0.8
  pitch: 1.1

# 解除好友关系
friend-removed:
  sound: BLOCK_NOTE_BLOCK_BASS
  volume: 0.7
  pitch: 0.8

# 通用成功操作
success:
  sound: UI_BUTTON_CLICK
  volume: 0.8
  pitch: 1.2

# 快捷交互唤起
quick-interact:
  sound: UI_BUTTON_CLICK
  volume: 0.7
  pitch: 1.3

# 收到传送请求
tp-request-received:
  sound: ENTITY_ENDERMAN_TELEPORT
  volume: 0.7
  pitch: 1.2

# 发出私聊或留言
msg-sent:
  sound: UI_BUTTON_CLICK
  volume: 0.6
  pitch: 1.3

# 收到私聊或留言
msg-received:
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.8
  pitch: 1.4

# 未读消息提醒
unread-alert:
  sound: BLOCK_NOTE_BLOCK_CHIME
  volume: 0.8
  pitch: 1.0

# 发布动态
status-publish:
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 0.7
  pitch: 1.2

# 动态点赞
status-like:
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.7
  pitch: 1.25

# 动态评论
status-comment:
  sound: BLOCK_NOTE_BLOCK_CHIME
  volume: 0.8
  pitch: 1.05

# 发布留言墙留言
wall-post:
  sound: UI_BUTTON_CLICK
  volume: 0.7
  pitch: 1.1

# 收到留言墙新留言提醒
wall-post-notice:
  sound: BLOCK_NOTE_BLOCK_CHIME
  volume: 0.8
  pitch: 1.0

# 留言墙点赞
wall-like:
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.7
  pitch: 1.2

# 留言墙评论回复
wall-comment:
  sound: BLOCK_NOTE_BLOCK_BELL
  volume: 0.8
  pitch: 1.0

# 好友上线
friend-online:
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.7
  pitch: 1.5

# 好友下线
friend-offline:
  sound: BLOCK_NOTE_BLOCK_BASS
  volume: 0.5
  pitch: 0.9

# 开启好友上下线提醒
notify-enabled:
  sound: UI_BUTTON_CLICK
  volume: 0.7
  pitch: 1.2

# 关闭好友上下线提醒
notify-disabled:
  sound: UI_BUTTON_CLICK
  volume: 0.7
  pitch: 0.8

# 允许自身上下线广播给好友
notifyme-enabled:
  sound: UI_BUTTON_CLICK
  volume: 0.7
  pitch: 1.2

# 关闭自身上下线广播
notifyme-disabled:
  sound: UI_BUTTON_CLICK
  volume: 0.7
  pitch: 0.8

# 传送模式切换至允许直达
tp-toggle-enabled:
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 0.7
  pitch: 1.2

# 传送模式切换至需要确认
tp-toggle-confirm:
  sound: UI_BUTTON_CLICK
  volume: 0.7
  pitch: 1.0

# 传送模式切换至拒绝传送
tp-toggle-disabled:
  sound: BLOCK_NOTE_BLOCK_BASS
  volume: 0.7
  pitch: 0.8

# 成功设置生日
birthday-set-success:
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 0.8
  pitch: 1.2

# 生日设置失败或输入无效
birthday-set-failed:
  sound: BLOCK_NOTE_BLOCK_BASS
  volume: 0.7
  pitch: 0.8

# 自身收到生日提醒
birthday-reminder-self:
  sound: ENTITY_PLAYER_LEVELUP
  volume: 0.9
  pitch: 1.2

# 收到好友生日提醒
birthday-reminder-friend:
  sound: BLOCK_NOTE_BLOCK_CHIME
  volume: 0.8
  pitch: 1.1
