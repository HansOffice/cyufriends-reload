# CyuFriends Reload - 个人主页主菜单配置
# 玩家执行 /friend 或 /friend gui 时打开的核心社交中枢
#
# 菜单结构字段
# title                - 界面标题，支持 MiniMessage 渐变与变量
# layout               - 字符界面网格，每行严格 9 槽，行数决定菜单大小（6 行 = 54 格），空格为空位
# items                - 按键字典，每个字符映射具体图标与动作
#
# 按钮配置字段
# material             - 原版材质名（如 PLAYER_HEAD、PAPER），亦支持外部物品（ia:、ox:、ce:、nexo:）
# head                 - 头颅材质来源，支持 %player_name%（当前玩家）、玩家名、Base64 或贴图哈希
# custom_model_data    - 资源包材质编号
# name / lore          - 按钮名称与说明，支持 MiniMessage 与颜色标签
# actions              - 点击动作，按 left / right / shift_left / shift_right 分开配置
#
# 颜色与排版语法
# <#RRGGBB>            - 十六进制颜色
# <gradient:#A:#B>文字</gradient> - 双色或多色渐变
# <gray> <aqua> 等标签  - 原生颜色标签
#
# 当前主页可用占位符
# %player_name%        - 当前玩家名称
# %player_uid_display% - 玩家唯一数字 UID（需安装 CyuID）
# %bio%                - 个性签名预览
# %bio_limit%          - 个性签名最大字符数限制
# %friend_count%       - 好友总数
# %friend_online_count%- 在线好友数
# %group_count%        - 分组总数
# %request_count%      - 待处理申请数
# %sent_request_count% - 已发出申请数
# %unread_count%       - 未读离线留言数
# %notification_count% - 未读综合通知数
# %birthday%           - 已绑定生日
# %blacklist_count%    - 已拉黑玩家数
# %recommend_count%    - 共同好友推荐数
# %status_count%       - 动态发布数
# %wall_count%         - 留言墙留言数
#
# 常用动作指令语法
# [player] <指令>      - 玩家自身执行指令（不带斜杠）
# [console] <指令>     - 控制台身份执行指令
# [close]              - 关闭当前界面
# [sound] <音效>       - 播放指定音效
# [birthday_input]     - 唤起聊天栏生日录入
# [bio_input]          - 唤起聊天栏个性签名录入

title: "<gradient:#5FD9FF:#82E6D2><bold>个人主页</bold></gradient> <dark_gray>|</dark_gray> <gray>%player_name%</gray>"
layout:
  - "#########"
  - "#H#     #"
  - "# # RSWT#"
  - "#F# MGBD#"
  - "#O# ACQY#"
  - "#########"
items:
  # 边框装饰板
  '#':
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    name: " "

  # 玩家个人资料卡片
  'H':
    # 按钮材质，头颅固定为 PLAYER_HEAD
    material: PLAYER_HEAD
    # 头颅皮肤来源，%player_name% 自动渲染当前打开界面的玩家皮肤
    head: "%player_name%"
    # 按钮标题
    name: "<aqua><bold>%player_name%</bold></aqua>"
    # 按钮说明，可使用当前界面的上下文占位符
    lore:
      - "<gray>%player_uid_label%</gray> <white>%player_uid_display%</white>"
      - "<gray>签名</gray> <white>%bio%</white>"
      - "<gray>好友</gray> <white>%friend_count%</white> <dark_gray>|</dark_gray> <gray>在线</gray> <aqua>%friend_online_count%</aqua> <dark_gray>|</dark_gray> <gray>分组</gray> <white>%group_count%</white>"
      - "<gray>申请</gray> <yellow>%request_count%</yellow>/<white>%sent_request_count%</white> <dark_gray>|</dark_gray> <gray>消息</gray> <aqua>%unread_count%</aqua> <dark_gray>|</dark_gray> <gray>通知</gray> <yellow>%notification_count%</yellow>"
      - "<gray>生日</gray> <white>%birthday%</white> <dark_gray>|</dark_gray> <gray>黑名单</gray> <white>%blacklist_count%</white>"
      - "<gray>点击原位刷新主页数据</gray>"
