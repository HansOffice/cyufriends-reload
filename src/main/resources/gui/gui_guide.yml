# CyuFriends Reload GUI 配置指南与速查手册
# 配置文件目录：plugins/cyufriends-reload/gui/
# 修改配置后执行 /friend reload 即可即时热重载生效
# 标准按键隐喻：# 边框、< > 翻页、B 返回、X 关闭

# 界面文件与指令入口对照
# friends_list.yml              好友列表                  /friend list
# friend_profile.yml            好友资料                  /friend profile <玩家>
# add_friend.yml                添加好友确认              /friend addgui <玩家>
# friend_remove_confirm.yml     删除好友确认              /friend removeconfirm <玩家>
# friend_tag_manage.yml         标签管理                  /friend tagpanel <好友>
# friend_tag_colors.yml         标签颜色                  /friend tagcolorpanel <好友> <标签>
# friend_tag_filters.yml        标签筛选                  /friend tagfilterpanel
# groups_list.yml               分组列表                  /friend grouplist
# group_members.yml             分组成员                  /friend groupmembers <分组>
# group_move.yml                移动分组                  /friend groupmove <好友>
# requests_list.yml             好友申请                  /friend requests
# blacklist.yml                 黑名单                    /friend blacklist
# online_players.yml            在线玩家                  /friend online
# profile_home.yml              个人主页                  /friend gui
# settings_panel.yml            个人设置                  /settings
# messages_list.yml             未读留言                  /friend messages
# message_chat.yml              私聊会话                  /friend chat <好友>
# status_list.yml               动态列表                  /status
# wall_view.yml                 留言墙                    /wall <玩家>
# wall_pending.yml              待审核留言                /wall pending <玩家>
# wall_comment_pending.yml      待审核回复                /wall commentpending <墙ID>

# 基本结构与布局规范
# layout 每行必须恰好包含 9 个字符，行数即为箱子行数（1 至 6 行对应 9 至 54 格）
# 同一字符在 layout 中重复出现时，将复用 items 中对应字符的按键配置
# 空格表示无交互的纯空白槽位
#
# 示例结构：
# title: "<gradient:#5FD9FF:#82E6D2><bold>个人主页</bold></gradient> <dark_gray>|</dark_gray> <gray>%player_name%</gray>"
# layout:
#   - "#########"
#   - "#H#     #"
#   - "# # RSWT#"
#   - "#F# MGBD#"
#   - "#O# ACQY#"
#   - "#########"
# items:
#   '#':
#     material: GRAY_STAINED_GLASS_PANE
#     name: " "

# 按键配置字段（items）
# material             - 原版材质名（如 PLAYER_HEAD、PAPER），支持外部物品标识
#   - 原版材质: PAPER, BARRIER, PLAYER_HEAD
#   - 材质简写模型: PAPER#1001
#   - ItemsAdder: ia:命名空间:物品ID
#   - Oraxen: ox:物品ID
#   - Nexo: nexo:物品ID
#   - CraftEngine: ce:命名空间:物品ID 或 craftengine: "命名空间:物品ID"
#
# custom_model_data    - 资源包模型数值编号（如 1001）
#
# head                 - 头颅材质来源，material 为 PLAYER_HEAD 时生效
#   - 当前查看者: head: "%player_name%"
#   - 目标玩家: head: "%raw_name%"
#   - 静态玩家名: head: "Notch"
#   - Base64 材质: head: "basehead-eyJ0ZXh0dXJlcyI6..."
#   - 纹理地址: head: "https://textures.minecraft.net/texture/xxxx"
#
# amount               - 物品堆叠数量，默认为 1
# name                 - 按钮标题，支持 MiniMessage 与 Hex 渐变
# lore                 - 按钮描述列表，支持 MiniMessage
# sound / sounds       - 点击音效，缺省使用 sounds.yml 中的全局默认音效
#   - 单音效: sound: gui-confirm
#   - 分键位: sounds: { left: gui-confirm, right: gui-secondary-click }

# 分页按钮与第一页 / 最后一页样式
# 分页按钮处于第一页或最后一页时，自动读取 config.yml 中的禁用态样式：
# gui.pagination.disabled.previous 与 gui.pagination.disabled.next
# 同样支持 material、craftengine、name、lore 与 custom_model_data

# 交互动作语法（actions）
# actions 支持单行、列表或分键位字典多形态配置：
# 1. 单行语法：actions: "[open] profile_home"
# 2. 列表语法：actions: ["[sound] ...", "[open] ..."]
# 3. 分键位字典：
#    actions:
#      all:          # 任意点击均触发，常用于通用按键音
#        - "[sound] UI_BUTTON_CLICK 1.0 1.2"
#      left:         # 左键点击
#        - "[open] friends_list"
#      right:        # 右键点击
#        - "[open] friend_recommendations"
#      shift_left:   # Shift + 左键（兼容 shift-left）
#        - "[open] settings_panel"
#      shift_right:  # Shift + 右键（兼容 shift-right）
#        - "[open] blacklist"
#      default:      # 缺省兜底（未定义键位回退）
#        - "[refresh]"
#
# 键位降级链：shift-right -> right -> default -> left -> all
#
# 常用通用动作：
# - "[open] <界面名> [参数]"     - 原生打开指定界面（如 profile_home, friends_list, friend_profile %target_name%）
# - "[refresh]"                 - 原位局部静默刷新当前界面数据
# - "[close]"                   - 关闭当前界面
# - "[actionbar] <文本>"        - 发送 ActionBar 底部快捷提示，支持 MiniMessage 标签
# - "[message] <文本>"          - 直接向玩家私发文本消息，支持 MiniMessage 标签
# - "[title] <主标题>[;<副标题>]"- 发送大屏 Title 标题提示
# - "[sound] <音效名> [音量] [音调]" - 播放音效，兼容原版 Sound 枚举与 sounds.yml 预设别名
# - "[player] <指令>"           - 以玩家身份执行指定指令（不带斜杠）
# - "[console] <指令>"          - 以控制台身份执行指令，支持 %player% 占位符
# - "[prev_page]"               - 翻到上一页
# - "[next_page]"               - 翻到下一页
#
# 业务输入捕获动作（由插件内部事件路由监听，改动动作名将导致无法唤起输入）：
# - "[pm_input] %raw_name%"                           - 唤起与指定好友的私聊输入
# - "[note_input] %raw_name%"                         - 唤起好友备注名录入
# - "[note_detail_input] %raw_name%"                  - 唤起好友备注详细说明录入
# - "[status_input]"                                  - 唤起动态文本录入
# - "[wall_input] %raw_name%"                         - 唤起留言墙留言录入
# - "[birthday_input]"                                - 唤起个人生日日期录入
# - "[bio_input]"                                     - 唤起个人个性签名录入
# - "[tag_color_input] %raw_name%||%primary_edit_tag%" - 唤起好友标签颜色录入

# 调色板与排版规范
# 推荐采用 Cyu 经典冷静低饱和调色板，拒绝荧光刺眼高饱和搭配：
# 边框与暗辅助色: <#3A4352>
# 亮文字与主要标题: <#D7DEE8>
# 暗说明与次要标签: <#8A96A8>
# 重点高亮与数值: <#7DD3FC> 或 <aqua>
# 强调与警示: <#FF6B6B>
# 引导符: › 或 ▸
# 渐变标题语法: <gradient:#5FD9FF:#82E6D2><bold>界面标题</bold></gradient>

# 常用内置占位符速查
# 基础信息：
# %player%             - 当前玩家名称
# %player_name%        - 当前玩家名称
# %target_name%        - 当前查看的目标玩家名称
# %friend_name%        - 好友名称
# %raw_name%           - 目标玩家原始用户名
# %group_name%         - 所属分组名称
# %tag_name%           - 标签名称
# %server_name%        - 所在子服名称
# %online_scope%       - 在线范围（本服 / 跨服 / 离线）
#
# 统计与分页：
# %page%               - 当前页码
# %total_pages%        - 总页码
# %friend_count%       - 好友总数
# %friend_online_count%- 在线好友数
# %unread_count%       - 未读消息数
# %status_count%       - 动态总数
# %wall_count%         - 留言总数

