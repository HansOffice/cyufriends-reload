# 快速排错指南
# 界面打不开：检查 layout 每行字符数是否恰好为 9；检查 YAML 缩进；检查 layout 中是否有字符未在 items 中定义
# 点击无响应：检查 actions 是否正确定位在对应按键下；检查动作命令名称拼写是否准确
# 头颅无法显示：确认 material 为 PLAYER_HEAD；检查 basehead 是否完整粘贴；检查网络是否能访问头颅材质源
# 外部物品不显示：确认对应外部材质插件已正常启动；检查物品命名空间与 ID 是否完全匹配
# 占位符未被替换：确认当前界面是否支持该占位符；全局占位符确认已安装 PlaceholderAPI
