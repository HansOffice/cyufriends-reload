# 欢迎使用 CyuFriends-Reload
# MineBBS: https://www.minebbs.com/members/hansoffice.59149/
# QQ群聊：331910315
#
# --- 权限节点 ---
# cyufriends.use   - 普通玩家功能
# cyufriends.admin - 重载与管理功能
#
# --- 主要文件 ---
# Permissions.yml - 完整权限节点速查
# Placeholder.yml - 完整变量速查
# lang/           - 提示与交互文本（zh_cn / en_us）
# sounds.yml      - 音效配置
# gui/*.yml       - 界面布局与动作
#
# 配置版本，请不要手动降低版本号
config-version: 117

# 配置布局协议版本，结构调整时自增
config-layout: 1

# 语言设置（zh_cn / en_us），对应 lang/ 目录下的语言文件
language: zh_cn

# 调试日志，日常运行请保持关闭
debugLog:
  # 控制台调试输出开关
  enable-console-output: false
  # 文件调试输出开关
  enable-file-output: false
  # 调试日志输出路径
  file: "logs/debug.log"
  # 详细级别：0 基础 / 1 关键过程 / 2 完整交互
  detail-level: 0
  # 数据库慢查询阈值（毫秒）
  slow-db-ms: 150

# 数据库存储
database:
  # 存储类型：SQLite 或 MySQL，单服保持 SQLite 即可
  type: SQLite
  # MySQL 主机地址
  host: localhost
  # MySQL 端口
  port: 3306
  # 数据库名称
  database: cyufriends
  # 数据库用户名
  username: root
  # 数据库密码
  password: ""

# 基础设置
settings:
  # 好友申请冷却兜底（秒），未配置权限组分档时生效
  request-cooldown: 60
  # 聊天栏输入模式等待超时（秒）
  text-input-timeout-seconds: 90
  # 需确认的好友传送请求保留时长（秒）
  tp-request-timeout-seconds: 60
  # 默认最大好友数量，无权限组加成时生效
  max-friends-default: 50

# 界面头颅与分页样式
gui:
  # 默认离线头颅材质，为空时使用插件内置离线头，支持玩家名、Base64 或贴图哈希
  default-offline-head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDM0NGY5YmJiMzcwMWM3ZWVjZTAxODY0MmE3ODM3YzMzMzE1YWMzOTg4ZWUyYmZkZTk2ZTg3NzI0OTZlNzQ4NSJ9fX0="
  # 静态头颅缓存上限，推荐范围 128 ~ 1024
  head-cache-size: 512
  # 分页按钮处于第一页或最后一页时的禁用态样式
  pagination:
    disabled:
      enabled: true
      previous:
        material: GRAY_STAINED_GLASS_PANE
        name: "<#3A4352>已是第一页</#3A4352>"
        lore:
          - "<#8A96A8>当前页</#8A96A8> <#D7DEE8>%page%</#D7DEE8><#8A96A8>/</#8A96A8><#D7DEE8>%total_pages%</#D7DEE8>"
      next:
        material: GRAY_STAINED_GLASS_PANE
        name: "<#3A4352>已是最后一页</#3A4352>"
        lore:
          - "<#8A96A8>当前页</#8A96A8> <#D7DEE8>%page%</#D7DEE8><#8A96A8>/</#8A96A8><#D7DEE8>%total_pages%</#D7DEE8>"

# 玩家进服社交状态摘要提示
joinChat:
  # 进服摘要总开关
  enabled: true
  # 摘要内容行列表，支持 MiniMessage 标签与 {onlineCount}、{unreadCount} 占位符
  lines:
    - "<#3A4352><st>                              </st></#3A4352>"
    - "<#D7DEE8>欢迎回来，<#7DD3FC><bold>CyuFriends</bold></#7DD3FC> 已同步你的社交状态</#D7DEE8>"
    - "<#D7DEE8>在线好友 <#7DD3FC>{onlineCount}</#7DD3FC> 位，未读留言 <#7DD3FC>{unreadCount}</#7DD3FC> 条</#D7DEE8>"
    - "<#3A4352><st>                              </st></#3A4352>"

# 玩家快捷交互设置
interactionSettings:
  # 空手 Shift + 右键目标玩家唤起好友菜单
  shiftRightClickMenu: true
  # 快捷交互防误触冷却（秒）
  cooldownSeconds: 3
  # 快捷交互音效标识
  sound: quick-interact

# 禁止好友传送的世界名称列表
disabledWorlds: []

# 好友申请权限组限制，对应权限 cyufriends.request.<组名>
requestLimits:
  default:
    # 每日申请次数上限，0 为不限制
    daily: 20
    # 两次申请之间的冷却时间（秒）
    cooldown: 60
  vip:
    daily: 35
    cooldown: 40
  svip:
    daily: 60
    cooldown: 20

# 好友申请附言字数限制
requestNotes:
  # 申请附言最大字符数
  max-length: 48
  # 界面与聊天栏中的附言预览字数
  preview-length: 24

# 私聊发送冷却（秒）
messageCooldown: 60

# 离线留言保留时长（秒），604800 为 7 天，0 为永久保留
messageExpiration: 604800

# 黑名单公共聊天过滤
chatFilter:
  # 拉黑后是否自动屏蔽对方在公共频道的发言
  hide-blocked-public-chat: true
  # 免除屏蔽的权限节点
  bypass-permission: "cyufriends.bypass.chatfilter"

# 动态权限组限制，对应权限 cyufriends.status.<组名>
statusLimits:
  default:
    # 个人动态保留条数上限
    maxStatuses: 20
    # 发布动态冷却时间（秒）
    publishCooldown: 60
    # 评论动态冷却时间（秒）
    commentCooldown: 15
  vip:
    maxStatuses: 30
    publishCooldown: 40
    commentCooldown: 10
  svip:
    maxStatuses: 50
    publishCooldown: 20
    commentCooldown: 5

# 留言墙权限组限制，对应权限 cyufriends.wall.<组名>
wallLimits:
  default:
    # 单个留言墙保留条数上限
    maxMessages: 20
    # 发布留言冷却时间（秒）
    postCooldown: 60
    # 回复留言冷却时间（秒）
    replyCooldown: 15
  vip:
    maxMessages: 30
    postCooldown: 40
    replyCooldown: 10
  svip:
    maxMessages: 50
    postCooldown: 20
    replyCooldown: 5

# 留言墙权限与访问控制
wallPermissions:
  # 默认可见度：public (所有人可见) / friends (仅好友可见) / private (仅墙主可见)
  default-visibility: public
  # 查看留言墙是否必须先成为好友
  view-requires-friend: false
  # 发布留言是否必须先成为好友
  post-requires-friend: true
  # 评论留言是否必须先成为好友
  comment-requires-friend: true
  # 点赞留言是否必须先成为好友
  like-requires-friend: false
  # 是否允许查看与管理自己的留言墙
  allow-self: true

# 留言墙内容审核
wallModeration:
  # 留言审核总开关
  enabled: false
  # 墙主自身留言是否免审自动通过
  auto-approve-self: true
  # 产生待审核内容时是否提醒墙主
  notify-owner: true
  # 留言回复评论审核开关
  comment-enabled: false
  # 墙主回复评论是否免审自动通过
  comment-auto-approve-self: true
  # 产生待审回复时是否提醒墙主
  comment-notify-owner: true
  # 是否记录审核日志
  audit-log: true
  # 审核日志文件路径（相对插件数据目录）
  audit-file: "logs/wall-moderation.log"

# 社交互动提醒全服总开关
socialNotifications:
  # 动态点赞提醒
  status-like: true
  # 动态评论提醒
  status-comment: true
  # 留言墙新留言提醒
  wall-post: true
  # 留言点赞提醒
  wall-like: true
  # 留言回复评论提醒
  wall-comment: true
  # 提醒消息中的内容预览字数
  preview-length: 24

# 关系互动时间线
timeline:
  # 时间线卡片中的文本预览字数
  preview-length: 32
  # 每对好友保留的互动记录上限
  keep-per-friend: 32

# 生日定时提醒任务
birthdayReminder:
  # 是否启用生日定时检测与提醒
  enabled: false
  # 每日检测时间（24 小时制 HH:mm）
  checkTime: "00:05"
  # 提前提醒天数列表，0 为当天，1 为提前 1 天
  advance-days:
    - 0
    - 1
  # 生日当天广播提示
  friendMessage: "今天是 {player} 的生日，别忘了送上祝福"
  # 提前提醒提示
  advanceMessage: "{player} 还有 {days} 天就生日了，记得提前准备祝福"
  # 禁用提醒的世界列表
  disabledWorlds:
    - "text"

# 生日修改次数限制，对应权限 cyufriends.birthday.<组名>
birthdayLimits:
  # 允许修改生日的总次数，0 为不可修改
  default: 1
  vip: 2
  svip: 3

# 个人主页与资料
profile:
  # 个性签名最大字数
  bio-max-length: 64
  # 个人主页与列表里的签名预览字数
  bio-preview-length: 32

# 核心功能模块开关
# 关闭模块后，相关命令、界面入口与提醒将同步隐藏
# friend 为核心底座，若关闭则 group、chat、social、profile 不会加载
modules:
  # 好友核心模块
  friend: true
  # 分组管理模块
  group: true
  # 私聊与离线留言模块
  chat: true
  # 动态与留言墙模块
  social: true
  # 个人主页与资料模块
  profile: true
  # 跨服代理模块，单服发布包默认关闭
  proxy: false

# 跨服代理设置，单服部署保持 enabled: false 即可
# 跨服部署需开启 modules.proxy 与 proxy.enabled，所有后端服与代理端共用同一套 channel / secret 与共享 MySQL 数据库
proxy:
  # 跨服功能总开关
  enabled: false
  # 当前后端子服唯一标识
  server-id: "survival-1"
  # 跨服通信频道名，所有子服与代理端必须一致
  channel: "cyufriends:gateway"
  # 跨服通信协议版本
  protocol-version: 1
  # 跨服通信共享密钥
  secret: "change-this-secret"
  # 允许的时钟误差（秒），0 为关闭校验
  max-clock-skew-seconds: 15
  # 跨服私聊回执超时（秒）
  direct-message-timeout-seconds: 8
  # 跨服传送预检超时（秒）
  teleport-precheck-timeout-seconds: 6
  # 在线状态心跳刷新周期（秒）
  presence-refresh-seconds: 60
