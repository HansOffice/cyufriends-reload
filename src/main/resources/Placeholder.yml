# PlaceholderAPI 变量速查
# 可用于计分板、聊天格式、TAB 栏及支持 PAPI 的菜单中，前缀可在 identifiers 中调整
#
# 参数说明：
# <player>      - 玩家名或 UID
# <index>       - 好友列表索引，从 1 开始
# <statusIndex> - 某位好友的第几条动态，从 1 开始
# <wallIndex>   - 某位好友的第几条留言，从 1 开始
# <slot>        - 在线玩家槽位，从 1 开始

# 变量标识符前缀
identifiers:
  # 新版推荐主前缀，示例：%cyufriends_total_count%
  reload: "cyufriends"
  # 兼容旧版写法，示例：%friends_total_count%
  plus-compatible: "friends"
  # 新版关系占位符前缀
  relational-reload: "rel_cyufriends"
  # 兼容旧版关系写法
  relational-plus-compatible: "friendsrel"

# 基础统计类变量
basic:
  # 当前玩家好友总数
  total_count: "%cyufriends_total_count%"
  # 当前玩家待处理好友申请数
  request_count: "%cyufriends_request_count%"
  # 当前玩家未读离线留言数
  offline_messages_count: "%cyufriends_offline_messages_count%"
  # 当前玩家今日剩余好友申请次数
  daily_requests_remaining: "%cyufriends_daily_requests_remaining%"

# 按指定玩家查询
player:
  # 指定玩家最后在线时间
  last_online: "%cyufriends_last_online_<player>%"
  # 指定玩家在线状态
  online_status: "%cyufriends_online_status_<player>%"
  # 指定玩家在线范围（本服 / 跨服 / 离线）
  online_scope: "%cyufriends_online_scope_<player>%"
  # 指定玩家当前所在服务器
  server: "%cyufriends_server_<player>%"
  # 是否为远端在线玩家
  is_remote: "%cyufriends_is_remote_<player>%"
  # 当前玩家给该玩家设置的备注
  note: "%cyufriends_note_<player>%"
  # 当前玩家给该玩家设置的备注说明
  note_detail: "%cyufriends_note_detail_<player>%"
  # 该好友所在分组
  group: "%cyufriends_group_<player>%"
  # 主标签
  primary_tag: "%cyufriends_primary_tag_<player>%"
  # 主标签颜色
  primary_tag_color: "%cyufriends_primary_tag_color_<player>%"
  # 全部标签
  tags: "%cyufriends_tags_<player>%"
  # 标签数量
  tag_count: "%cyufriends_tag_count_<player>%"
  # 是否被置顶
  is_pinned: "%cyufriends_is_pinned_<player>%"
  # 是否已被拉黑
  is_blocked: "%cyufriends_is_blocked_<player>%"
  # 成为好友时间
  first_added: "%cyufriends_first_added_<player>%"
  # 最近互动时间
  last_interaction: "%cyufriends_last_interaction_<player>%"
  # 是否为好友
  is_friend: "%cyufriends_is_friend_<player>%"
  # 生日
  birthday: "%cyufriends_birthday_<player>%"
  # 是否允许好友传送
  is_tp_allowed: "%cyufriends_is_tp_allowed_<player>%"
  # 该玩家自己的全局传送规则
  tp_mode: "%cyufriends_tp_mode_<player>%"
  # 当前对我实际生效的传送规则
  effective_tp_mode: "%cyufriends_effective_tp_mode_<player>%"
  # 单好友传送覆盖规则
  personal_tp: "%cyufriends_personal_tp_<player>%"
  # 单好友上线提醒覆盖规则
  personal_notify: "%cyufriends_personal_notify_<player>%"
  # 我对该好友的广播可见覆盖规则
  personal_notifyme: "%cyufriends_personal_notifyme_<player>%"

# 好友列表按索引查询
friend_index:
  # 第 <index> 位好友名称
  name: "%cyufriends_friendlist_friends_<index>%"
  # 第 <index> 位好友在线状态
  online_status: "%cyufriends_friendlist_online_status_by_index_<index>%"
  # 第 <index> 位好友最后在线时间
  last_online: "%cyufriends_friendlist_last_online_by_index_<index>%"
  # 第 <index> 位好友备注
  note: "%cyufriends_friendlist_note_by_index_<index>%"
  # 第 <index> 位好友备注说明
  note_detail: "%cyufriends_friendlist_note_detail_by_index_<index>%"
  # 第 <index> 位好友分组
  group: "%cyufriends_friendlist_group_by_index_<index>%"
  # 第 <index> 位好友主标签
  primary_tag: "%cyufriends_friendlist_primary_tag_by_index_<index>%"
  # 第 <index> 位好友主标签颜色
  primary_tag_color: "%cyufriends_friendlist_primary_tag_color_by_index_<index>%"
  # 第 <index> 位好友全部标签
  tags: "%cyufriends_friendlist_tags_by_index_<index>%"
  # 第 <index> 位好友标签数量
  tag_count: "%cyufriends_tag_count_by_index_<index>%"
  # 第 <index> 位好友是否置顶
  is_pinned: "%cyufriends_friendlist_is_pinned_by_index_<index>%"
  # 第 <index> 位好友添加时间
  first_added: "%cyufriends_friendlist_first_added_by_index_<index>%"
  # 第 <index> 位好友最近互动时间
  last_interaction: "%cyufriends_friendlist_last_interaction_by_index_<index>%"
  # 第 <index> 位好友是否被拉黑
  is_blocked: "%cyufriends_friendlist_is_blocked_by_index_<index>%"
  # 第 <index> 位好友生日
  birthday: "%cyufriends_friendlist_birthday_by_index_<index>%"
  # 第 <index> 位好友是否允许传送
  is_tp_allowed: "%cyufriends_friendlist_is_tp_allowed_by_index_<index>%"
  # 第 <index> 位好友全局传送模式
  tp_mode: "%cyufriends_friendlist_tp_mode_by_index_<index>%"
  # 第 <index> 位好友对我实际生效的传送模式
  effective_tp_mode: "%cyufriends_friendlist_effective_tp_mode_by_index_<index>%"
  # 第 <index> 位好友最新动态
  status: "%cyufriends_friendlist_status_by_index_<index>%"
  # 第 <index> 位好友第 <statusIndex> 条动态
  status_at: "%cyufriends_friendlist_status_by_index_<index>_<statusIndex>%"
  # 第 <index> 位好友动态总数
  status_count: "%cyufriends_friendlist_status_count_by_index_<index>%"
  # 第 <index> 位好友留言墙留言总数
  wall_count: "%cyufriends_friendlist_wall_count_by_index_<index>%"
  # 第 <index> 位好友第 <wallIndex> 条留言
  wall: "%cyufriends_friendlist_wall_by_index_<index>_<wallIndex>%"
  # 第 <index> 位好友第 <wallIndex> 条留言发送者
  wall_sender: "%cyufriends_friendlist_wall_sender_by_index_<index>_<wallIndex>%"
  # 第 <index> 位好友第 <wallIndex> 条留言时间
  wall_time: "%cyufriends_friendlist_wall_time_by_index_<index>_<wallIndex>%"

# 标签使用统计
owned_tags:
  # 某个标签被使用了多少次
  count: "%cyufriends_owned_tag_count_<标签名>%"
  # 某个标签被设为主标签多少次
  primary_count: "%cyufriends_owned_primary_tag_count_<标签名>%"
  # 某个标签当前默认展示色
  color: "%cyufriends_owned_tag_color_<标签名>%"

# 目标玩家公开资料
target:
  # 我是否已向该玩家发出申请
  request_sent: "%cyufriends_friendlist_request_sent_<player>%"
  # 我是否收到了该玩家的申请
  request_received: "%cyufriends_friendlist_request_received_<player>%"
  # 我与该玩家当前申请状态
  request_status: "%cyufriends_friendlist_request_status_<player>%"
  # 该玩家好友数量
  friend_count: "%cyufriends_friendlist_friend_count_<player>%"
  # 该玩家最新动态
  status: "%cyufriends_friendlist_status_<player>%"
  # 该玩家动态总数
  status_count: "%cyufriends_friendlist_status_count_<player>%"
  # 该玩家留言墙留言总数
  wall_count: "%cyufriends_friendlist_wall_count_<player>%"
  # 该玩家留言墙总页数
  wall_page_count: "%cyufriends_friendlist_wall_page_count_<player>%"
  # 该玩家留言墙当前页
  wall_page_current: "%cyufriends_friendlist_wall_page_current_<player>%"
  # 该玩家第 <wallIndex> 条留言
  wall: "%cyufriends_friendlist_wall_<player>_<wallIndex>%"
  # 该玩家第 <wallIndex> 条留言发送者
  wall_sender: "%cyufriends_friendlist_wall_sender_<player>_<wallIndex>%"
  # 该玩家第 <wallIndex> 条留言时间
  wall_time: "%cyufriends_friendlist_wall_time_<player>_<wallIndex>%"

# 在线玩家槽位
online_slots:
  # 第 <slot> 个在线玩家名称
  player_name: "%cyufriends_online_player_name_by_slot_<slot>%"
  # 第 <slot> 个在线玩家是否是我的好友
  is_friend: "%cyufriends_is_friend_by_slot_<slot>%"

# 关系占位符，根据观察者与目标玩家的双向关系返回结果，常用于聊天格式或称号
relational:
  # 返回双向关系文本结果
  is_friend: "%rel_cyufriends_is_friend%"
  # 返回布尔值 true / false
  is_friend_bool: "%rel_cyufriends_is_friend_bool%"
  # 兼容旧版关系占位符
  plus_compatible: "%rel_friendsrel_is_friend%"
  # 兼容旧版关系布尔占位符
  plus_compatible_bool: "%rel_friendsrel_is_friend_bool%"
